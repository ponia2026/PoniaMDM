name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build exe
        shell: pwsh
        run: ./packaging/build_exe.ps1
      - name: Test (pytest)
        run: python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: PoniaMDM-windows
          path: dist/PoniaMDM.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/PoniaMDM.exe --title "PoniaMDM ${{ github.ref_name }}" --generate-notes || gh release upload "${{ github.ref_name }}" dist/PoniaMDM.exe --clobber
